name: pdf_reader
description: "PDF reader and utility app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0
  file_picker: ^8.1.2
  syncfusion_flutter_pdfviewer: ^28.1.33
  pdf: ^3.11.1
  printing: ^5.13.2
  image: 4.5.4
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  share_plus: ^10.1.2
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true